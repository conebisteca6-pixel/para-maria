<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma surpresa pra você ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%;
    overflow:hidden;
  }

  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-image:
      linear-gradient(160deg, rgba(6,14,30,0.80), rgba(15,35,65,0.72), rgba(6,14,30,0.85)),
      url('fundo.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: 'Poppins', sans-serif;
    position:relative;
  }

  /* ---------- FUNDO DECORATIVO ---------- */
  .decor {
    position:fixed;
    top:-40px;
    pointer-events:none;
    z-index:0;
    animation: cairSuave linear infinite;
  }

  .decor.estrela {
    animation: cintilar 3s ease-in-out infinite;
    opacity:0.7;
  }

  @keyframes cairSuave {
    from { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    to   { transform: translateY(115vh) translateX(24px) rotate(220deg); }
  }

  @keyframes cintilar {
    0%,100% { opacity:0.25; }
    50% { opacity:0.9; }
  }

  .page {
    display:none;
    text-align:center;
    padding:46px 40px;
    max-width:640px;
    width:88%;
    position:relative;
    z-index:1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  .page.active {
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: apareceCard 1s ease;
  }

  @keyframes apareceCard {
    from { opacity:0; transform: translateY(18px) scale(0.98); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  /* ---------- PÁGINA 1 ---------- */
  #titulo1 {
    color:#fdfdfd;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.9rem;
    line-height:1.35;
    margin-bottom:28px;
    text-shadow: 2px 2px 14px rgba(0,0,0,0.5);
  }

  .coracao {
    font-size:2.6rem;
    animation: pulsa 1.6s ease-in-out infinite;
    margin-bottom:18px;
    filter: drop-shadow(0 0 12px rgba(140,190,255,0.55));
  }

  @keyframes pulsa {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.15); }
  }

  button {
    background: linear-gradient(135deg, #ffffff, #dfe9ff);
    color:#1c3a5e;
    border:none;
    padding:15px 38px;
    font-family:'Poppins', sans-serif;
    font-size:1.02rem;
    font-weight:600;
    letter-spacing:0.3px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  button:hover {
    transform:scale(1.06);
    box-shadow:0 14px 30px rgba(0,0,0,0.4);
  }

  /* ---------- FRASES ---------- */
  #frases {
    color:#f4f7ff;
    font-family:'Playfair Display', serif;
    font-size:1.28rem;
    font-weight:500;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-shadow: 1px 1px 10px rgba(0,0,0,0.5);
    margin:18px 0 6px;
    line-height:1.6;
  }

  .frase {
    opacity:0;
    animation: fadeInUp 1.3s forwards;
  }

  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(18px); }
    to { opacity:1; transform:translateY(0); }
  }

  #btnProxima {
    opacity:0;
    animation: fadeInUp 1s forwards;
    margin-top:10px;
  }

  /* ---------- PÁGINA 2 (pedido final) ---------- */
  #titulo2 {
    color:#fdfdfd;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:2.15rem;
    margin-bottom:12px;
    text-shadow: 2px 2px 16px rgba(0,0,0,0.5);
  }

  #subtitulo2 {
    color:#dce6f5;
    font-size:0.98rem;
    margin-bottom:34px;
    font-weight:300;
    letter-spacing:0.3px;
  }

  .botoes-final {
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
  }

  #btnNao {
    background:transparent;
    color:#fff;
    border:2px solid rgba(255,255,255,0.7);
    box-shadow:none;
  }

  #respostaFinal {
    color:#fff;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.5rem;
    margin-top:28px;
    min-height:40px;
  }

  .emoji-flutuante {
    position:fixed;
    top:-50px;
    font-size:1.5rem;
    animation: cair linear forwards;
    pointer-events:none;
    z-index:2;
  }

  @keyframes cair {
    to { transform: translateY(112vh) rotate(360deg); opacity:0.25; }
  }

  @media (max-width: 480px) {
    #titulo1 { font-size:1.5rem; }
    #titulo2 { font-size:1.7rem; }
    #frases { font-size:1.08rem; }
    .page { padding:34px 22px; }
  }
</style>
</head>
<body>

  <div class="page active" id="pagina1">
    <div class="coracao">💙</div>
    <h1 id="titulo1">Oi, Maria... tenho uma coisa pra te mostrar</h1>
    <button id="btnInicio" onclick="iniciarFrases()">Clica aqui 👉</button>

    <div id="frases"></div>
  </div>

  <div class="page" id="pagina2">
    <h1 id="titulo2">Quer namorar comigo? 💍</h1>
    <div id="subtitulo2">a resposta é só um clique...</div>
    <div class="botoes-final">
      <button id="btnSim" onclick="dizerSim()">SIM! ❤️</button>
      <button id="btnNao" onmouseover="fugir(this)">Não</button>
    </div>
    <div id="respostaFinal"></div>
  </div>

<script>
  // ======= FRASES (edite aqui se quiser mudar algo) =======
  const frases = [
    "Oiii meu amor, Maria...",
    "Tem uma coisa que eu preciso te dizer olhando nos seus olhos.",
    "Desde que te conheci, minha vida ficou mais feliz, mais leve, mais alegre.",
    "Você trouxe cor pra dias que eu nem sabia que estavam cinzas.",
    "Quero te agradecer por ser essa pessoa incrível comigo.",
    "Por nunca desistir de mim, independente dos meus erros.",
    "Por me escutar, me entender e ficar do meu lado, sempre.",
    "Cada detalhe seu virou o meu lugar favorito no mundo.",
    "Enfim... eu te amo muito.",
    "E agora estou aqui pra te pedir uma coisa..."
  ];

  // Tempo entre cada frase (em milissegundos). 5500 = 5,5 segundos.
  const TEMPO_ENTRE_FRASES = 5500;
  // =====================================

  function iniciarFrases() {
    document.getElementById('btnInicio').style.display = 'none';
    const container = document.getElementById('frases');
    let i = 0;

    function mostrarProxima() {
      container.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'frase';
      p.textContent = frases[i];
      container.appendChild(p);
      i++;

      if (i < frases.length) {
        setTimeout(mostrarProxima, TEMPO_ENTRE_FRASES);
      } else {
        setTimeout(mostrarBotaoProxima, TEMPO_ENTRE_FRASES);
      }
    }

    mostrarProxima();
  }

  function mostrarBotaoProxima() {
    const container = document.getElementById('frases');
    const btn = document.createElement('button');
    btn.id = 'btnProxima';
    btn.textContent = 'Continuar →';
    btn.onclick = irParaPagina2;
    container.appendChild(btn);
  }

  function irParaPagina2() {
    document.getElementById('pagina1').classList.remove('active');
    document.getElementById('pagina2').classList.add('active');
  }

  function dizerSim() {
    document.getElementById('respostaFinal').textContent = 'Upiiii! Te amo muito! 🥰💙';
    lancarConfete();
  }

  // O botão "Não" foge do mouse, hehe
  function fugir(btn) {
    const maxX = window.innerWidth - 150;
    const maxY = window.innerHeight - 100;
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    btn.style.position = 'fixed';
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }

  function lancarConfete() {
    const emojis = ['💙','💖','💕','✨','💍'];
    for (let i = 0; i < 44; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'emoji-flutuante';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4200);
      }, i * 75);
    }
  }

  // Fundo decorativo: estrelinhas e coraçõezinhos caindo bem devagar
  function criarDecoracao() {
    const simbolos = ['✨','⭐','💙','🌙'];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'decor' + (Math.random() > 0.5 ? ' estrela' : '');
      el.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (11 + Math.random() * 10) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (0.9 + Math.random() * 0.9) + 'rem';
      document.body.appendChild(el);
    }
  }
  criarDecoracao();
</script>

</body>
</html>
